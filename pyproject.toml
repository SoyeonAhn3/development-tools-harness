[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "development-tools-harness"
version = "0.1.0"
description = "A local, approval-aware development harness foundation"
requires-python = ">=3.12,<3.13"
dependencies = ["psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
dev-harness = "development_harness.cli:main"

[tool.setuptools]
packages = ["development_harness", "development_harness._phase_doc"]

[tool.setuptools.package-dir]
"" = "src"
"development_harness._phase_doc" = ".agents/skills/phase-doc"

[tool.setuptools.package-data]
"development_harness._phase_doc" = ["SKILL.md", "references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = "-ra"
